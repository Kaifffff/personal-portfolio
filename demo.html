<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Portfolio</title>
  <style>
    body {
  font-family: Arial, sans-serif;
  margin: 20px;
  background-color: #f0f0f0;
}

header, section, footer {
  margin-bottom: 20px;
  background: #fff;
  padding: 20px;
  border-radius: 8px;
}

#site-title {
  color: #333;
  transition: color 0.3s;
}

button {
  padding: 10px 15px;
  background-color: #007bff;
  color: white;
  border: none;
  border-radius: 5px;
  cursor: pointer;
}

  </style>
  <!-- Include jQuery CDN -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>

  <header>
    <h1 id="site-title">Welcome to My Portfolio</h1>
    <button id="toggle-about">Toggle About Section</button>
  </header>

  <section id="about">
    <h2>About Me</h2>
    <p>I am a passionate web developer with skills in HTML, CSS, JavaScript, and more.</p>
  </section>

  <section id="projects">
    <h2>Projects</h2>
    <ul>
      <li>Personal Blog</li>
      <li>ToDo App</li>
      <li>Weather App</li>
    </ul>
  </section>

  <footer>
    <button id="back-to-top">Back to Top</button>
  </footer>

  <!-- jQuery Script -->
  <script>
    $(document).ready(function() {
      // Toggle the About section
      $('#toggle-about').click(function() {
        $('#about').slideToggle(); // Smooth hide/show effect
      });

      // Smooth scroll to top
      $('#back-to-top').click(function() {
        $('html, body').animate({ scrollTop: 0 }, 'slow');
      });

      // Animate title on hover
      $('#site-title').hover(
        function() {
          $(this).css('color', '#ff5722');
        },
        function() {
          $(this).css('color', '#333');
        }
      );
    });
  </script>

</body>
</html>
